name: Testy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Te same wersje co na serwerze.
      - run: pip install -r requirements.lock pytest && pip install --no-deps -e .
      # Testy są offline: bez kluczy i bez sieci (atrapy API).
      - run: pytest
